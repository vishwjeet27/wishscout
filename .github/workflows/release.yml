name: Build & Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      is_draft:
        description: 'Publish as a Draft Release'
        required: true
        type: boolean
        default: false
      is_prerelease:
        description: 'Publish as a Pre-release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows x64 Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Pre-Build Verification Suite
        run: npm run check

      - name: Build Standalone Windows NSIS Package
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/*.exe | ForEach-Object {
            $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding utf8 -Append
          }
          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content dist/SHA256SUMS.txt

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: wishscout-windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          draft: ${{ inputs.is_draft || false }}
          prerelease: ${{ inputs.is_prerelease || false }}
          generate_release_notes: true
          name: WishScout ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
